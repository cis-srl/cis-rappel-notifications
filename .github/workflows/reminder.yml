name: Rappel SOJ/CDG (notifications push)

on:
  schedule:
    # Toutes les 15 minutes. GitHub n'exécute pas forcément pile à l'heure (quelques
    # minutes de retard possibles aux heures de forte charge) — le script lui-même
    # vérifie l'heure exacte et ne fait rien avant l'heure du bandeau (17h par défaut).
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # permet de le lancer manuellement depuis l'onglet "Actions", pour tester

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: node send-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
